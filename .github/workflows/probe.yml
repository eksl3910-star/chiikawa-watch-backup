name: Backup provider integration test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install yt-dlp
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python automation/probe-download.py
